# Local infrastructure.
#   pnpm dev                          → db in Docker, apps native with hot reload (recommended)
#   docker compose --profile full up  → db + api in containers (production-like image)
services:
  db:
    image: postgres:17-alpine
    container_name: jat-postgres
    environment:
      POSTGRES_USER: jat
      POSTGRES_PASSWORD: jat
      POSTGRES_DB: job_tracker
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jat -d job_tracker']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://jat:jat@db:5432/job_tracker
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@example.com}
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
